<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>InsightOS - OSINT & Crypto Platform</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=DM+Sans:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* --- CSS Variables for Themes --- */
        :root {
            --primary-color: #4361ee;
            --primary-light: #4895ef;
            --primary-dark: #3a0ca3;
            --secondary-color: #7209b7;
            --accent-color: #06d6a0;
            --success-color: #4cc9f0;
            --danger-color: #e11d48;
            --warning-color: #f59e0b;
            --info-color: #06d6a0;

            --bg-color: #f5f6fa;
            --bg-subtle: #eef0f5;
            --card-bg: #ffffff;
            --sidebar-bg: #ffffff;
            --text-color: #1a1d2e;
            --text-light: #6b7280;
            --text-muted: #9ca3af;
            --border-color: #e5e7eb;
            --border-strong: #d1d5db;

            --shadow-sm: 0 1px 2px rgba(16, 24, 40, 0.04);
            --shadow-md: 0 2px 8px rgba(16, 24, 40, 0.06), 0 1px 2px rgba(16, 24, 40, 0.04);
            --shadow-lg: 0 8px 24px rgba(16, 24, 40, 0.08), 0 2px 6px rgba(16, 24, 40, 0.04);
            --shadow-xl: 0 20px 40px rgba(16, 24, 40, 0.10), 0 4px 12px rgba(16, 24, 40, 0.05);

            --sidebar-width: 300px;
            --border-radius-sm: 8px;
            --border-radius: 10px;
            --border-radius-lg: 14px;
            --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);

            --font-display: 'DM Sans', 'Inter', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', 'Courier New', monospace;
        }

        /* --- Dark Theme Variables --- */
        body.dark {
            --primary-color: #6d83f2;
            --primary-light: #8ba3f5;
            --accent-color: #10b981;

            --bg-color: #0b0d12;
            --bg-subtle: #111318;
            --card-bg: #16181f;
            --sidebar-bg: #12141a;
            --text-color: #e8eaf0;
            --text-light: #9ca3af;
            --text-muted: #6b7280;
            --border-color: #262a35;
            --border-strong: #353a47;

            --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.2);
            --shadow-md: 0 2px 8px rgba(0, 0, 0, 0.25);
            --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.35);
            --shadow-xl: 0 20px 40px rgba(0, 0, 0, 0.45);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-body);
            background-color: var(--bg-color);
            color: var(--text-color);
            line-height: 1.6;
            transition: background-color 0.3s ease, color 0.3s ease;
            display: flex;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            font-feature-settings: "cv02", "cv03", "cv04", "cv11";
        }

        .layout-container {
            display: flex;
            width: 100%;
            min-height: 100vh;
            position: relative;
        }

        /* === SIDEBAR === */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: var(--sidebar-width);
            background-color: var(--sidebar-bg);
            box-shadow: var(--shadow-md);
            display: flex;
            flex-direction: column;
            transition: var(--transition);
            z-index: 1000;
            border-right: 1px solid var(--border-color);
            overflow: hidden;
        }

        .sidebar.closed {
            transform: translateX(-100%);
            box-shadow: none;
        }

        .sidebar-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 24px 22px 20px 22px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .sidebar-header h1 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 22px;
            letter-spacing: -0.02em;
            color: var(--text-color);
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: 700;
            font-size: 16px;
            font-family: var(--font-display);
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.25);
        }

        /* === SIDEBAR SEARCH === */
        .sidebar-search {
            padding: 16px 22px;
            border-bottom: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .search-container {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
            height: 40px;
            background-color: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            transition: border-color 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
        }

        .search-container:hover {
            border-color: var(--border-strong);
        }

        .search-container:focus-within {
            border-color: var(--primary-color);
            background-color: var(--card-bg);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.10);
        }

        .search-icon {
            flex-shrink: 0;
            width: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-muted);
            font-size: 13px;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .search-container:focus-within .search-icon {
            color: var(--primary-color);
        }

        .search-input {
            flex: 1;
            min-width: 0;
            height: 100%;
            padding: 0 14px 0 2px;
            border: none;
            background: transparent;
            color: var(--text-color);
            font-size: 14px;
            font-family: var(--font-body);
            outline: none;
        }

        .search-input::placeholder {
            color: var(--text-muted);
        }

        .search-clear {
            flex-shrink: 0;
            width: 28px;
            height: 28px;
            margin-right: 6px;
            display: none;
            align-items: center;
            justify-content: center;
            background: transparent;
            border: none;
            border-radius: 6px;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 11px;
            transition: all 0.15s ease;
        }

        .search-clear:hover {
            background-color: var(--border-color);
            color: var(--text-color);
        }

        .search-container.has-value .search-clear {
            display: flex;
        }

        /* === SIDEBAR NAVIGATION === */
        .sidebar-nav {
            flex: 1;
            overflow-y: auto;
            padding: 16px 14px;
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .sidebar-nav::-webkit-scrollbar {
            width: 6px;
        }

        .sidebar-nav::-webkit-scrollbar-track {
            background: transparent;
        }

        .sidebar-nav::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 3px;
        }

        .sidebar-nav::-webkit-scrollbar-thumb:hover {
            background: var(--text-muted);
        }

        .nav-section-label {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 12px 10px 8px 10px;
            margin-top: 4px;
        }

        /* === TRACKER BUTTONS === */
        .tracker-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 10px 12px;
            border: none;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            background: transparent;
            color: var(--text-light);
            font-weight: 500;
            font-size: 14px;
            font-family: var(--font-body);
            transition: var(--transition);
            text-align: left;
            position: relative;
            width: 100%;
        }

        .tracker-btn:hover {
            background-color: var(--bg-subtle);
            color: var(--text-color);
        }

        .tracker-btn.active {
            background-color: rgba(67, 97, 238, 0.08);
            color: var(--primary-color);
            font-weight: 600;
        }

        body.dark .tracker-btn.active {
            background-color: rgba(109, 131, 242, 0.12);
        }

        .tracker-btn i {
            width: 18px;
            text-align: center;
            font-size: 14px;
        }

        /* === CATEGORY === */
        .sidebar-category {
            margin-top: 8px;
        }

        .category-header {
            display: flex;
            align-items: center;
            padding: 10px 12px;
            border-radius: var(--border-radius-sm);
            color: var(--text-light);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
            cursor: pointer;
            transition: var(--transition);
            user-select: none;
        }

        .category-header:hover {
            color: var(--text-color);
        }

        .category-header i:first-child {
            margin-right: 10px;
            font-size: 13px;
            color: var(--primary-color);
        }

        .category-header .toggle-icon {
            margin-left: auto;
            transition: transform 0.2s ease;
            font-size: 10px;
        }

        .category-header.collapsed .toggle-icon {
            transform: rotate(-90deg);
        }

        .category-items {
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
            transition: var(--transition);
            padding: 4px 0;
        }

        .category-items.collapsed {
            display: none;
        }

        /* === CRYPTO TOOL BUTTONS === */
        .crypto-tool-btn {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 9px 12px;
            border: none;
            border-radius: var(--border-radius-sm);
            cursor: pointer;
            background: transparent;
            color: var(--text-light);
            font-weight: 500;
            font-size: 13.5px;
            font-family: var(--font-body);
            transition: var(--transition);
            text-align: left;
            width: 100%;
        }

        .crypto-tool-btn:hover {
            background-color: var(--bg-subtle);
            color: var(--text-color);
        }

        .crypto-tool-btn.active {
            background-color: rgba(6, 214, 160, 0.08);
            color: var(--accent-color);
            font-weight: 600;
        }

        body.dark .crypto-tool-btn.active {
            background-color: rgba(16, 185, 129, 0.12);
        }

        .crypto-tool-btn i {
            width: 16px;
            text-align: center;
            font-size: 13px;
        }

        .crypto-tool-btn span:not(.badge) {
            flex: 1;
        }

        .badge {
            padding: 2px 7px;
            border-radius: 6px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.04em;
            font-family: var(--font-body);
        }

        .badge-encode  { background: rgba(67, 97, 238, 0.12);  color: var(--primary-color); }
        .badge-decode  { background: rgba(114, 9, 183, 0.12);  color: var(--secondary-color); }
        .badge-hash    { background: rgba(6, 214, 160, 0.15);  color: var(--accent-color); }
        .badge-cipher  { background: rgba(245, 158, 11, 0.15); color: var(--warning-color); }
        .badge-encrypt { background: rgba(225, 29, 72, 0.12);  color: var(--danger-color); }
        .badge-calc    { background: rgba(76, 201, 240, 0.15); color: var(--success-color); }

        body.dark .badge-encode  { background: rgba(109, 131, 242, 0.18); }
        body.dark .badge-hash    { background: rgba(16, 185, 129, 0.20); }

        /* === SIDEBAR FOOTER === */
        .sidebar-footer {
            padding: 16px 18px;
            border-top: 1px solid var(--border-color);
            background-color: var(--sidebar-bg);
            flex-shrink: 0;
        }

        .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 11px;
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--border-color);
            cursor: pointer;
            background-color: var(--bg-subtle);
            color: var(--text-color);
            font-weight: 500;
            font-size: 13.5px;
            font-family: var(--font-body);
            transition: var(--transition);
        }

        .theme-toggle:hover {
            border-color: var(--border-strong);
            background-color: var(--card-bg);
        }

        .theme-toggle i {
            color: var(--primary-color);
        }

        /* === MAIN CONTENT === */
        .main {
            flex: 1;
            margin-left: var(--sidebar-width);
            padding: 48px 40px;
            transition: var(--transition);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }

        .sidebar.closed ~ .main {
            margin-left: 0;
        }

        /* === CARD === */
        .card {
            background-color: var(--card-bg);
            padding: 40px 44px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            max-width: 880px;
            width: 100%;
            transition: var(--transition);
            border: 1px solid var(--border-color);
        }

        .card-header {
            margin-bottom: 32px;
            display: flex;
            align-items: center;
            gap: 14px;
            padding-bottom: 24px;
            border-bottom: 1px solid var(--border-color);
        }

        .card-header h2 {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 24px;
            letter-spacing: -0.02em;
            color: var(--text-color);
        }

        .card-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            border-radius: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 17px;
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.20);
        }

        /* === FORM === */
        .track-form {
            display: flex;
            flex-direction: column;
            gap: 22px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .input-label {
            font-weight: 600;
            font-size: 13.5px;
            color: var(--text-color);
            letter-spacing: -0.005em;
        }

        textarea, input[type="text"] {
            width: 100%;
            padding: 13px 16px;
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--border-color);
            font-size: 14.5px;
            background-color: var(--bg-subtle);
            color: var(--text-color);
            transition: var(--transition);
            font-family: var(--font-body);
        }

        textarea {
            font-family: var(--font-mono);
            font-size: 13.5px;
            resize: vertical;
            min-height: 110px;
        }

        textarea:focus, input[type="text"]:focus {
            border-color: var(--primary-color);
            outline: none;
            background-color: var(--card-bg);
            box-shadow: 0 0 0 3px rgba(67, 97, 238, 0.10);
        }

        .input-hint {
            font-size: 13px;
            color: var(--text-light);
        }

        .btn {
            position: relative;
            width: 100%;
            padding: 13px 18px;
            border: none;
            border-radius: var(--border-radius-sm);
            background: linear-gradient(135deg, var(--primary-color), var(--secondary-color));
            color: white;
            font-size: 14.5px;
            font-weight: 600;
            font-family: var(--font-body);
            letter-spacing: -0.005em;
            cursor: pointer;
            overflow: hidden;
            transition: var(--transition);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.22);
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(67, 97, 238, 0.30);
        }

        .btn:active {
            transform: translateY(0);
        }

        .btn.loading {
            pointer-events: none;
            opacity: 0.85;
        }

        .btn.loading::after {
            content: "";
            position: absolute;
            right: 20px;
            width: 16px;
            height: 16px;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top: 2.5px solid white;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* === RADIO MODE === */
        .mode-group {
            display: flex;
            gap: 8px;
            background-color: var(--bg-subtle);
            padding: 4px;
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--border-color);
            width: fit-content;
        }

        .mode-group label {
            display: flex;
            align-items: center;
            gap: 7px;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13.5px;
            font-weight: 500;
            color: var(--text-light);
            transition: var(--transition);
        }

        .mode-group label:has(input:checked) {
            background-color: var(--card-bg);
            color: var(--primary-color);
            font-weight: 600;
            box-shadow: var(--shadow-sm);
        }

        .mode-group input[type="radio"] {
            accent-color: var(--primary-color);
        }

        /* === FILE UPLOAD === */
        .file-upload {
            display: none;
        }

        .file-label {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 32px 20px;
            border: 1.5px dashed var(--border-strong);
            border-radius: var(--border-radius);
            background-color: var(--bg-subtle);
            cursor: pointer;
            transition: var(--transition);
            text-align: center;
            color: var(--text-light);
            font-size: 14px;
        }

        .file-label i {
            font-size: 26px;
            color: var(--primary-color);
        }

        .file-label:hover {
            border-color: var(--primary-color);
            background-color: rgba(67, 97, 238, 0.04);
            color: var(--text-color);
        }

        .file-name {
            margin-top: 10px;
            font-size: 13px;
            color: var(--text-light);
            text-align: center;
            font-family: var(--font-mono);
        }

        /* === RESULTS === */
        .result-container {
            margin-top: 28px;
            width: 100%;
            max-width: 880px;
        }

        .result {
            background-color: var(--card-bg);
            padding: 28px 32px;
            border-radius: var(--border-radius-lg);
            box-shadow: var(--shadow-md);
            transition: var(--transition);
            border: 1px solid var(--border-color);
            border-left: 3px solid var(--primary-color);
            position: relative;
            animation: slideUp 0.3s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
            padding-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
        }

        .result-title {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 17px;
            color: var(--text-color);
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.01em;
        }

        .result-title i {
            color: var(--primary-color);
            font-size: 15px;
        }

        .clear {
            padding: 7px 14px;
            border-radius: 7px;
            border: 1px solid var(--border-color);
            background-color: transparent;
            color: var(--text-light);
            cursor: pointer;
            font-weight: 500;
            font-size: 12.5px;
            font-family: var(--font-body);
            transition: var(--transition);
        }

        .clear:hover {
            background-color: rgba(225, 29, 72, 0.08);
            color: var(--danger-color);
            border-color: rgba(225, 29, 72, 0.2);
        }

        .result-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 12px;
        }

        .result-item {
            display: flex;
            flex-direction: column;
            padding: 14px 16px;
            background-color: var(--bg-subtle);
            border-radius: var(--border-radius-sm);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }

        .result-item:hover {
            border-color: var(--border-strong);
            box-shadow: var(--shadow-sm);
        }

        .result-key {
            font-weight: 600;
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 0.06em;
        }

        .result-value {
            font-weight: 500;
            font-size: 14px;
            color: var(--text-color);
            word-break: break-word;
            line-height: 1.5;
        }

        .result-value.error {
            color: var(--danger-color);
        }

        .result-value.mono {
            font-family: var(--font-mono);
            font-size: 13px;
        }

        /* === RESULT SECTIONS (for nested data) === */
        .result-section {
            margin-top: 22px;
            padding-top: 22px;
            border-top: 1px solid var(--border-color);
        }

        .result-section:first-of-type {
            margin-top: 0;
            padding-top: 0;
            border-top: none;
        }

        .section-title {
            display: flex;
            align-items: center;
            gap: 10px;
            font-family: var(--font-display);
            font-weight: 600;
            font-size: 14px;
            color: var(--text-color);
            margin-bottom: 14px;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .section-title i {
            width: 26px;
            height: 26px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: rgba(67, 97, 238, 0.10);
            color: var(--primary-color);
            border-radius: 7px;
            font-size: 12px;
        }

        body.dark .section-title i {
            background: rgba(109, 131, 242, 0.15);
        }

        /* Status pill badges */
        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            padding: 3px 10px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        .status-pill.good    { background: rgba(6, 214, 160, 0.12);  color: var(--accent-color); }
        .status-pill.bad     { background: rgba(225, 29, 72, 0.10);  color: var(--danger-color); }
        .status-pill.neutral { background: var(--bg-subtle);         color: var(--text-light); border: 1px solid var(--border-color); }
        .status-pill.warn    { background: rgba(245, 158, 11, 0.15); color: var(--warning-color); }

        /* Tag/chip list for arrays (mx records, selectors, ips) */
        .chip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 4px;
        }

        .chip {
            display: inline-flex;
            align-items: center;
            padding: 4px 10px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-family: var(--font-mono);
            font-size: 12px;
            color: var(--text-color);
            word-break: break-all;
        }

        /* Security score bar */
        .score-card {
            display: flex;
            flex-direction: column;
            gap: 10px;
            padding: 16px 18px;
            background: var(--bg-subtle);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            grid-column: 1 / -1;
        }

        .score-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
        }

        .score-label {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-color);
        }

        .score-value {
            font-family: var(--font-display);
            font-weight: 700;
            font-size: 22px;
            letter-spacing: -0.02em;
        }

        .score-value.excellent { color: var(--accent-color); }
        .score-value.good      { color: var(--success-color); }
        .score-value.weak      { color: var(--warning-color); }
        .score-value.poor      { color: var(--danger-color); }

        .score-bar {
            height: 6px;
            background: var(--border-color);
            border-radius: 3px;
            overflow: hidden;
        }

        .score-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .score-bar-fill.excellent { background: var(--accent-color); }
        .score-bar-fill.good      { background: var(--success-color); }
        .score-bar-fill.weak      { background: var(--warning-color); }
        .score-bar-fill.poor      { background: var(--danger-color); }

        .score-notes {
            margin-top: 4px;
            font-size: 12.5px;
            color: var(--text-light);
            line-height: 1.6;
        }

        .score-notes ul {
            list-style: none;
            padding-left: 0;
            margin-top: 4px;
        }

        .score-notes li::before {
            content: "•";
            color: var(--warning-color);
            margin-right: 8px;
            font-weight: bold;
        }

        /* === COPY BUTTONS === */
        .result-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .copy-btn {
            padding: 8px 14px;
            background-color: var(--bg-subtle);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            border-radius: 7px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 500;
            font-family: var(--font-body);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 7px;
        }

        .copy-btn:hover {
            background-color: var(--card-bg);
            border-color: var(--primary-color);
            color: var(--primary-color);
        }

        .copy-btn i {
            font-size: 12px;
        }

        /* === HAMBURGER MENU === */
        .hamburger {
            display: none;
            position: fixed;
            top: 20px;
            left: 20px;
            width: 40px;
            height: 40px;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--border-radius-sm);
            box-shadow: var(--shadow-md);
            z-index: 1100;
            transition: var(--transition);
        }

        .hamburger:hover {
            box-shadow: var(--shadow-lg);
        }

        .hamburger div {
            height: 2px;
            width: 20px;
            background-color: var(--text-color);
            border-radius: 1px;
            transition: var(--transition);
            margin: 2.5px 0;
        }

        .hamburger.active div:nth-child(1) {
            transform: rotate(45deg) translate(5px, 5px);
        }

        .hamburger.active div:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active div:nth-child(3) {
            transform: rotate(-45deg) translate(5px, -5px);
        }

        /* === FOOTER === */
        .footer {
            margin-top: 40px;
            text-align: center;
            color: var(--text-muted);
            font-size: 13px;
        }

        .footer p {
            line-height: 1.8;
        }

        /* === RESPONSIVE === */
        @media (max-width: 1024px) {
            .card {
                max-width: 100%;
                padding: 32px 28px;
            }

            .result {
                padding: 24px;
            }

            .result-grid {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 768px) {
            .hamburger {
                display: flex;
            }

            .sidebar {
                transform: translateX(-100%);
                width: 280px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .main {
                margin-left: 0;
                padding: 80px 20px 40px 20px;
            }

            .card {
                padding: 24px 20px;
            }

            .card-header {
                gap: 12px;
            }

            .card-header h2 {
                font-size: 20px;
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 20px 16px;
            }

            .result {
                padding: 20px 16px;
            }

            .card-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .result-actions {
                flex-direction: column;
            }

            .copy-btn {
                justify-content: center;
            }
        }
    </style>
</head>

        'sha512':   { label: 'SHA-512 Hash', hint: 'Generate SHA-512 hash of input text', icon: 'fas fa-fingerprint', needsKey: false },
        'sha3-256': { label: 'SHA3-256 Hash', hint: 'Generate SHA3-256 hash of input text', icon: 'fas fa-fingerprint', needsKey: false },
        'sha3-512': { label: 'SHA3-512 Hash', hint: 'Generate SHA3-512 hash of input text', icon: 'fas fa-fingerprint', needsKey: false },

        'aes':      { label: 'AES Encryption', hint: 'Encrypt/decrypt text using AES', icon: 'fas fa-key', needsKey: true },
        'des':      { label: 'DES Encryption', hint: 'Encrypt/decrypt text using DES', icon: 'fas fa-key', needsKey: true },
        'blowfish': { label: 'Blowfish', hint: 'Encrypt/decrypt text using Blowfish', icon: 'fas fa-key', needsKey: true },
        'rc4':      { label: 'RC4 Cipher', hint: 'Encrypt/decrypt text using RC4', icon: 'fas fa-key', needsKey: true },

        'base32': { label: 'Base32 Encode', hint: 'Encode text in Base32', icon: 'fas fa-code', needsKey: false },
        'base58': { label: 'Base58 Encode', hint: 'Encode text in Base58', icon: 'fas fa-code', needsKey: false },
        'ascii':  { label: 'ASCII Convert', hint: 'Convert between text and ASCII codes', icon: 'fas fa-font', needsKey: false }
    };

    // Current state
    let currentType = 'phone';
    let currentCryptoTool = null;
    let isCryptoMode = false;

    // Initialize
    init();

    function init() {
        // Load theme
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark');
            themeIcon.className = 'fas fa-sun';
            themeLabel.textContent = 'Light Mode';
        }

        // Set up tracker buttons
        trackerButtons.forEach(button => {
            button.addEventListener('click', () => switchToTracker(button));
        });

        // Set up crypto tool buttons
        cryptoToolButtons.forEach(button => {
            button.addEventListener('click', () => switchToCryptoTool(button));
        });

        // Category toggles
        categoryHeaders.forEach(header => {
            header.addEventListener('click', () => {
                const category = header.getAttribute('data-category');
                const items = document.getElementById(`${category === 'crypto-analysis' ? 'cryptoAnalysis' : category}Items`);
                if (items) {
                    items.classList.toggle('collapsed');
                    header.classList.toggle('collapsed');
                }
            });
        });

        // Search functionality
        const searchContainer = document.getElementById('searchContainer');
        const searchClear = document.getElementById('searchClear');

        searchInput.addEventListener('input', function() {
            const searchTerm = this.value.toLowerCase().trim();
            searchContainer.classList.toggle('has-value', this.value.length > 0);
            filterSidebarItems(searchTerm);
        });

        searchClear.addEventListener('click', function() {
            searchInput.value = '';
            searchContainer.classList.remove('has-value');
            filterSidebarItems('');
            searchInput.focus();
        });

        // Theme toggle
        themeToggle.addEventListener('click', () => {
            const isDark = document.body.classList.toggle('dark');

            if (isDark) {
                themeIcon.className = 'fas fa-sun';
                themeLabel.textContent = 'Light Mode';
                localStorage.setItem('theme', 'dark');
            } else {
                themeIcon.className = 'fas fa-moon';
                themeLabel.textContent = 'Dark Mode';
                localStorage.setItem('theme', 'light');
            }
        });

        // Hamburger menu
        hamburger.addEventListener('click', () => {
            sidebar.classList.toggle('open');
            hamburger.classList.toggle('active');
        });

        // Close sidebar on mobile when clicking outside
        document.addEventListener('click', (e) => {
            if (window.innerWidth <= 768 &&
                !sidebar.contains(e.target) &&
                !hamburger.contains(e.target) &&
                sidebar.classList.contains('open')) {
                sidebar.classList.remove('open');
                hamburger.classList.remove('active');
            }
        });

        // Form submission
        form.addEventListener('submit', handleSubmit);
    }

    function switchToTracker(button) {
        isCryptoMode = false;
        currentCryptoTool = null;

        trackerButtons.forEach(b => b.classList.remove('active'));
        cryptoToolButtons.forEach(b => b.classList.remove('active'));
        button.classList.add('active');

        const type = button.getAttribute('data-type');
        currentType = type;
        typeInput.value = type;

        updateUIForTracker(type);

        if (window.innerWidth <= 768) {
            sidebar.classList.remove('open');
            hamburger.classList.remove('active');
        }
    }

    function switchToCryptoTool(button) {
        isCryptoMode = true;

        trackerButtons.forEach(b => b.classList.remove('active'));
        cryptoToolButtons.forEach(b => b.classList.remove('active'));
        button.classList.add('active');

        const tool = button.getAttribute('data-tool');
        currentCryptoTool = tool;
        typeInput.value = 'crypto-tool';

        updateUIForCryptoTool(tool);

        if (window.innerWidth <= 768) {
            sidebar.classList.remove('open');
            hamburger.classList.remove('active');
        }
    }

    function updateUIForTracker(type) {
        const config = trackerConfigs[type];

        cardTitle.textContent = config.title;
        cardIcon.className = `fas ${config.icon}`;

        inputLabel.textContent = config.label;
        inputHint.textContent = config.hint;
        btnText.textContent = config.btnText;

        document.getElementById('resultContainer').innerHTML = '';

        cryptoKeyGroup.style.display = 'none';
        cryptoModeGroup.style.display = 'none';

        if (type === 'metadata') {
            inputContainer.innerHTML = `
                <label class="file-label" for="fileInput">
                    <i class="fas fa-cloud-upload-alt"></i>
                    <span>Choose an image file (PNG, JPG, JPEG, GIF, TIFF, BMP)</span>
                </label>
                <input type="file" id="fileInput" class="file-upload" accept="image/*">
                <div id="fileName" class="file-name"></div>
            `;

            const fileInput = document.getElementById('fileInput');
            const fileName = document.getElementById('fileName');

            fileInput.addEventListener('change', function() {
                if (this.files.length > 0) {
                    fileName.textContent = `Selected: ${this.files[0].name}`;
                } else {
                    fileName.textContent = '';
                }
            });
        } else {
            inputContainer.innerHTML = `<input type="text" name="target" id="targetInput" placeholder="${config.placeholder}" required>`;
            document.getElementById('targetInput').focus();
        }
    }

    function updateUIForCryptoTool(tool) {
        const config = cryptoToolConfigs[tool];

        cardTitle.textContent = config.label;
        cardIcon.className = config.icon;

        inputLabel.textContent = 'Input Text';
        inputHint.textContent = config.hint;
        btnText.textContent = config.label;

        document.getElementById('resultContainer').innerHTML = '';

        cryptoKeyGroup.style.display = config.needsKey ? 'flex' : 'none';

        if (config.needsKey) {
            document.getElementById('cryptoKey').placeholder = tool === 'caesar' ? 'Enter shift (e.g., 3)' : 'Enter key';
        }

        // Show mode selection for relevant tools
        const showMode = tool.includes('encode') || tool.includes('decode') ||
                         tool === 'caesar' || tool === 'a1z26' || tool === 'morse' || tool === 'ascii';

        cryptoModeGroup.style.display = showMode ? 'flex' : 'none';

        if (showMode) {
            const modeRadios = document.querySelectorAll('input[name="cryptoMode"]');
            if (tool.includes('decode')) {
                modeRadios[1].checked = true;
            } else {
                modeRadios[0].checked = true;
            }
        }

        inputContainer.innerHTML = `<textarea name="target" id="targetInput" rows="4" placeholder="Enter text to process..."></textarea>`;
        document.getElementById('targetInput').focus();
    }

    function filterSidebarItems(searchTerm) {
        const allButtons = document.querySelectorAll('.tracker-btn, .crypto-tool-btn');

        if (searchTerm === '') {
            allButtons.forEach(button => button.style.display = 'flex');
            return;
        }

        allButtons.forEach(button => {
            const text = button.textContent.toLowerCase();
            button.style.display = text.includes(searchTerm) ? 'flex' : 'none';
        });
    }

    async function handleSubmit(e) {
        e.preventDefault();

        btn.classList.add('loading');
        btn.disabled = true;

        try {
            let endpoint, body, isFormData = false;
            let formData;

            if (isCryptoMode && currentCryptoTool) {
                const input = document.getElementById('targetInput').value;
                const key = document.getElementById('cryptoKey') ? document.getElementById('cryptoKey').value : '';
                const mode = document.querySelector('input[name="cryptoMode"]:checked')?.value || 'encode';

                if (!input.trim()) {
                    showError('Please enter some text');
                    return;
                }

                endpoint = '/crypto/process';
                body = JSON.stringify({
                    tool: currentCryptoTool,
                    input: input,
                    key: key,
                    mode: mode
                });
            } else {
                const type = currentType;
                const config = trackerConfigs[type];
                let target;

                if (type === 'metadata') {
                    const fileInput = document.getElementById('fileInput');
                    if (!fileInput || !fileInput.files.length) {
                        showError('Please select a file');
                        return;
                    }

                    formData = new FormData();
                    formData.append('file', fileInput.files[0]);
                    endpoint = config.endpoint;
                    isFormData = true;
                } else {
                    target = document.getElementById('targetInput').value;

                    if (!target.trim()) {
                        showError('Please enter a target');
                        return;
                    }

                    endpoint = config.endpoint;
                    body = JSON.stringify({
                        type: type,
                        target: target
                    });
                }
            }

            console.log(`Sending request to: ${API_BASE}${endpoint}`);

            const options = {
                method: 'POST',
                headers: isFormData ? {} : { 'Content-Type': 'application/json' },
                body: isFormData ? formData : body
            };

            const response = await fetch(`${API_BASE}${endpoint}`, options);

            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();

            if (data.success) {
                if (isCryptoMode) {
                    displayCryptoResults(data.result, currentCryptoTool);
                } else {
                    displayResults(data.results || data, currentType,
                        document.getElementById('targetInput')?.value || 'File Upload');
                }
            } else {
                showError(data.error || 'Operation failed');
            }

        } catch (error) {
            console.error('Error:', error);
            showError(`Error: ${error.message}. Make sure the Flask server is running at ${API_BASE}`);
        } finally {
            btn.classList.remove('loading');
            btn.disabled = false;
        }
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function displayCryptoResults(result, tool) {
        const resultContainer = document.getElementById('resultContainer');
        const toolConfig = cryptoToolConfigs[tool];
        const input = document.getElementById('targetInput').value;

        const resultStr = String(result);
        const inputPreview = input.length > 100 ? input.substring(0, 100) + '...' : input;

        const resultHTML = `
            <div class="result">
                <div class="result-header">
                    <div class="result-title">
                        <i class="${toolConfig.icon}"></i>
                        ${toolConfig.label} — Result
                    </div>
                    <button class="clear" onclick="this.closest('.result').remove()">Clear</button>
                </div>

                <div class="result-grid">
                    <div class="result-item">
                        <div class="result-key">Input</div>
                        <div class="result-value mono">${escapeHtml(inputPreview)}</div>
                    </div>

                    <div class="result-item">
                        <div class="result-key">Output</div>
                        <div class="result-value mono">${escapeHtml(resultStr)}</div>
                    </div>
                </div>

                <div class="result-actions">
                    <button class="copy-btn" data-copy="output">
                        <i class="fas fa-copy"></i> Copy Result
                    </button>
                    <button class="copy-btn" data-copy="input">
                        <i class="fas fa-copy"></i> Copy Input
                    </button>
                </div>
            </div>
        `;

        resultContainer.innerHTML = resultHTML;

        // Attach copy listeners safely (avoiding inline onclick with string interpolation)
        resultContainer.querySelector('[data-copy="output"]').addEventListener('click', function() {
            copyToClipboard(resultStr, this);
        });
        resultContainer.querySelector('[data-copy="input"]').addEventListener('click', function() {
            copyToClipboard(input, this);
        });

        resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    // --- Friendly labels & section config for nested result objects ---
    const SECTION_META = {
        format:          { title: 'Format', icon: 'fa-check-double' },
        classification:  { title: 'Classification', icon: 'fa-tags' },
        domain_info:     { title: 'Domain Info', icon: 'fa-globe' },
        mx_info:         { title: 'Mail Servers (MX)', icon: 'fa-server' },
        authentication: { title: 'Email Authentication', icon: 'fa-shield-halved' },
        gravatar:        { title: 'Gravatar', icon: 'fa-user-circle' },
        smtp:            { title: 'SMTP Probe', icon: 'fa-paper-plane' },
        breach_lookup:   { title: 'Breach Lookup', icon: 'fa-triangle-exclamation' },
        reverse_dns:     { title: 'Reverse DNS', icon: 'fa-rotate-left' },
    };

    // Keys that should render as chip lists instead of comma-joined strings
    const CHIP_KEYS = new Set([
        'mx_records', 'ipv4_addresses', 'ipv6_addresses',
        'dkim_selectors_found', 'notes',
    ]);

    // Keys whose value should always render mono-spaced
    const MONO_KEYS = new Set([
        'normalized', 'gmail_canonical', 'spf_record', 'dmarc_record',
        'primary_mx', 'gravatar_hash',
    ]);

    // Boolean keys where `true` is a positive signal (green check)
    // and boolean keys where `true` is actually a negative (red) signal.
    const BOOL_NEGATIVE_WHEN_TRUE = new Set([
        'is_disposable', 'is_role_based',
    ]);

    function displayResults(results, type, target) {
        const resultContainer = document.getElementById('resultContainer');

        if (!results || (typeof results === 'object' && Object.keys(results).length === 0)) {
            resultContainer.innerHTML = `
                <div class="result">
                    <div class="result-header">
                        <div class="result-title">
                            <i class="fas fa-info-circle"></i>
                            No Results Found
                        </div>
                        <button class="clear" onclick="this.closest('.result').remove()">Clear</button>
                    </div>
                    <div style="color: var(--text-light); text-align: center; padding: 20px;">
                        No data returned for ${escapeHtml(type)}: ${escapeHtml(target)}
                    </div>
                </div>
            `;
            return;
        }

        // If the backend returned a validation error block
        if (results.error && results.valid === false) {
            showError(results.error);
            return;
        }

        const headerHTML = `
            <div class="result-header">
                <div class="result-title">
                    <i class="fas ${trackerConfigs[type]?.icon || 'fa-search'}"></i>
                    Results for ${escapeHtml(type)}: ${escapeHtml(target)}
                </div>
                <button class="clear" onclick="this.closest('.result').remove()">Clear</button>
            </div>
        `;

        let bodyHTML = '';

        // Handle simple string results
        if (typeof results === 'string') {
            bodyHTML = `
                <div class="result-grid">
                    <div class="result-item">
                        <div class="result-key">Result</div>
                        <div class="result-value">${escapeHtml(results)}</div>
                    </div>
                </div>
            `;
        } else {
            bodyHTML = renderResultObject(results);
        }

        resultContainer.innerHTML = `<div class="result">${headerHTML}${bodyHTML}</div>`;
        resultContainer.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    /**
     * Render a result object, splitting nested objects into sections
     * and top-level scalars into a single top grid.
     */
    function renderResultObject(obj) {
        const topLevelScalars = {};
        const nestedSections = [];

        for (const [key, value] of Object.entries(obj)) {
            if (value === null || value === undefined) continue;
            if (key === 'error' || key === 'valid') continue;

            // Object = section (but not arrays)
            if (typeof value === 'object' && !Array.isArray(value)) {
                nestedSections.push([key, value]);
            } else {
                topLevelScalars[key] = value;
            }
        }

        let html = '';

        // Top-level scalars first (email, valid, etc.)
        if (Object.keys(topLevelScalars).length > 0) {
            html += `<div class="result-grid">`;
            for (const [key, value] of Object.entries(topLevelScalars)) {
                html += renderResultItem(key, value);
            }
            html += `</div>`;
        }

        // Then each nested object as a collapsible-style section
        for (const [sectionKey, sectionValue] of nestedSections) {
            html += renderSection(sectionKey, sectionValue);
        }

        return html;
    }

    function renderSection(sectionKey, sectionValue) {
        const meta = SECTION_META[sectionKey] || { title: formatKey(sectionKey), icon: 'fa-folder' };

        let inner = '<div class="result-grid">';

        // Special case: authentication section includes the score card
        if (sectionKey === 'authentication' && sectionValue.security_score) {
            inner += renderScoreCard(sectionValue.security_score);
        }

        for (const [key, value] of Object.entries(sectionValue)) {
            if (value === null || value === undefined) continue;
            if (key === 'security_score') continue; // handled above
            inner += renderResultItem(key, value);
        }

        inner += '</div>';

        return `
            <div class="result-section">
                <div class="section-title">
                    <i class="fas ${meta.icon}"></i>
                    ${escapeHtml(meta.title)}
                </div>
                ${inner}
            </div>
        `;
    }

    function renderResultItem(key, value) {
        const displayKey = formatKey(key);
        const displayValue = formatValue(value, key);
        return `
            <div class="result-item">
                <div class="result-key">${escapeHtml(displayKey)}</div>
                <div class="result-value">${displayValue}</div>
            </div>
        `;
    }

    function renderScoreCard(score) {
        const rating = (score.rating || 'poor').toLowerCase();
        const value = Number(score.score) || 0;

        let notesHTML = '';
        if (Array.isArray(score.notes) && score.notes.length > 0) {
            const items = score.notes.map(n => `<li>${escapeHtml(n)}</li>`).join('');
            notesHTML = `<div class="score-notes"><ul>${items}</ul></div>`;
        }

        return `
            <div class="score-card">
                <div class="score-header">
                    <div class="score-label">Security Score</div>
                    <div class="score-value ${rating}">${value}<span style="font-size: 14px; color: var(--text-light); font-weight: 500;">/100 · ${escapeHtml(rating)}</span></div>
                </div>
                <div class="score-bar">
                    <div class="score-bar-fill ${rating}" style="width: ${value}%;"></div>
                </div>
                ${notesHTML}
            </div>
        `;
    }

    function formatKey(key) {
        return String(key)
            .replace(/_/g, ' ')
            .replace(/\b\w/g, l => l.toUpperCase());
    }

    function formatValue(value, key) {
        if (value === null || value === undefined || value === '') return '<span style="color: var(--text-muted);">N/A</span>';

        // Arrays: render as chips for known "list" keys, otherwise join
        if (Array.isArray(value)) {
            if (value.length === 0) return '<span style="color: var(--text-muted);">None</span>';

            if (CHIP_KEYS.has(key) || value.every(v => typeof v === 'string' && v.length < 80)) {
                const chips = value.map(v => `<span class="chip">${escapeHtml(String(v))}</span>`).join('');
                return `<div class="chip-list">${chips}</div>`;
            }

            return escapeHtml(value.join(', '));
        }

        // Nested object fallback (shouldn't normally hit, but safe)
        if (typeof value === 'object') {
            if (Object.keys(value).length === 0) return '<span style="color: var(--text-muted);">No data</span>';
            return `<span class="mono" style="font-size: 12px;">${escapeHtml(JSON.stringify(value))}</span>`;
        }

        // Booleans with context-aware coloring
        if (typeof value === 'boolean') {
            const isNegativeSignal = BOOL_NEGATIVE_WHEN_TRUE.has(key);
            if (value) {
                const cls = isNegativeSignal ? 'bad' : 'good';
                const icon = isNegativeSignal ? 'fa-circle-exclamation' : 'fa-circle-check';
                return `<span class="status-pill ${cls}"><i class="fas ${icon}"></i> Yes</span>`;
            } else {
                const cls = isNegativeSignal ? 'good' : 'neutral';
                const icon = isNegativeSignal ? 'fa-circle-check' : 'fa-circle-xmark';
                return `<span class="status-pill ${cls}"><i class="fas ${icon}"></i> No</span>`;
            }
        }

        // URLs
        if (typeof value === 'string' && /^https?:\/\//i.test(value)) {
            const safeUrl = escapeHtml(value);
            return `<a href="${safeUrl}" target="_blank" rel="noopener noreferrer" style="color: var(--primary-color); text-decoration: none; border-bottom: 1px solid var(--primary-color); word-break: break-all;">${safeUrl}</a>`;
        }

        // Email addresses → mailto link
        if (typeof value === 'string' && /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(value)) {
            const safe = escapeHtml(value);
            return `<a href="mailto:${safe}" style="color: var(--primary-color); text-decoration: none; border-bottom: 1px solid var(--primary-color);">${safe}</a>`;
        }

        // Account type pill
        if (key === 'account_type') {
            const v = String(value).toLowerCase();
            const cls = (v === 'disposable') ? 'bad'
                      : (v === 'role_based') ? 'warn'
                      : (v === 'corporate') ? 'good'
                      : 'neutral';
            return `<span class="status-pill ${cls}">${escapeHtml(formatKey(value))}</span>`;
        }

        // DMARC policy pill
        if (key === 'dmarc_policy') {
            const v = String(value).toLowerCase();
            const cls = (v === 'reject') ? 'good'
                      : (v === 'quarantine') ? 'warn'
                      : 'bad';
            return `<span class="status-pill ${cls}">${escapeHtml(v)}</span>`;
        }

        // Rating pill
        if (key === 'rating') {
            const v = String(value).toLowerCase();
            const cls = (v === 'excellent') ? 'good'
                      : (v === 'good') ? 'good'
                      : (v === 'weak') ? 'warn'
                      : 'bad';
            return `<span class="status-pill ${cls}">${escapeHtml(v)}</span>`;
        }

        // Mono-spaced string content
        const str = String(value);
        if (MONO_KEYS.has(key) || str.length > 40) {
            return `<span class="mono">${escapeHtml(str)}</span>`;
        }

        return escapeHtml(str);
    }

    function showError(message) {
        const resultContainer = document.getElementById('resultContainer');
        resultContainer.innerHTML = `
            <div class="result" style="border-left-color: var(--danger-color);">
                <div class="result-header">
                    <div class="result-title" style="color: var(--danger-color);">
                        <i class="fas fa-exclamation-triangle"></i>
                        Error
                    </div>
                    <button class="clear" onclick="this.closest('.result').remove()">Clear</button>
                </div>
                <div class="result-grid">
                    <div class="result-item">
                        <div class="result-key">Details</div>
                        <div class="result-value error">${escapeHtml(message)}</div>
                    </div>
                </div>
            </div>
        `;
    }

    function copyToClipboard(text, btnEl) {
        navigator.clipboard.writeText(text).then(() => {
            const originalHTML = btnEl.innerHTML;
            btnEl.innerHTML = '<i class="fas fa-check"></i> Copied!';
            btnEl.style.color = 'var(--accent-color)';
            btnEl.style.borderColor = 'var(--accent-color)';

            setTimeout(() => {
                btnEl.innerHTML = originalHTML;
                btnEl.style.color = '';
                btnEl.style.borderColor = '';
            }, 1800);
        }).catch(err => {
            console.error('Copy failed:', err);
        });
    }
});
</script>
</body>
</html>
